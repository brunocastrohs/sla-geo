# Escala de 1 a 5 réplicas mantendo o uso médio de CPU em ~70% do request (250m).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sla-geo-core
  namespace: sla-geo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sla-geo-core
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
