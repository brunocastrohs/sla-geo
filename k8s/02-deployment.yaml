apiVersion: apps/v1
kind: Deployment
metadata:
  name: sla-geo-core
  namespace: sla-geo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sla-geo-core
  template:
    metadata:
      labels:
        app: sla-geo-core
    spec:
      containers:
        - name: sla-geo-core
          image: sla-geo-core:latest
          # imagem carregada com "minikube image load"; não buscar em registry
          imagePullPolicy: Never
          ports:
            - containerPort: 9090
          envFrom:
            - configMapRef:
                name: sla-geo-core-config
            - secretRef:
                name: sla-geo-core-secret
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9090
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9090
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9090
            periodSeconds: 10
