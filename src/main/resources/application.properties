spring.application.name=sla-geo-core

# PostgreSQL / PostGIS
spring.datasource.url=jdbc:postgresql://localhost:5435/sla-geo-poc
spring.datasource.username=postgres
spring.datasource.password=${SLA_GEO_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Server
server.port=9090

# IDE SISEMA
ide.sisema.base-url=${IDE_SISEMA_URL:https://homologa.idesisema.meioambiente.mg.gov.br/backend/api/webservice}
ide.sisema.token=${IDE_SISEMA_TOKEN:123}

# MinIO
minio.endpoint=${MINIO_ENDPOINT:http://127.0.0.1:9100}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket=${MINIO_BUCKET:sla-geo-denominacoes}

# Multipart / upload de arquivos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB
